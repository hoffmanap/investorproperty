name: Weekly El Paso Housing Data Sync & Deploy

on:
  schedule:
    # Triggers every Sunday night at midnight UTC (00:00)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to manually trigger the sync pipeline from the GitHub web UI anytime

# 1. CRITICAL FIX: Explicitly grant permissions for code changes and deployment authentication
permissions:
  contents: write  # Required to commit and push updated data/*.csv back to the repo
  pages: write     # Required to clear and deploy assets to GitHub Pages
  id-token: write  # Required to securely authenticate with the Pages backend via OIDC

# Allow only one concurrent deployment to prevent race conditions
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository so the runner can modify local data files
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Provision a lean Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Speeds up sequential execution pipelines

    # Step 3: Install structural processing requirements
    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    # Step 4: Execute the synchronization script securely
    - name: Run Data Engine Script
      env:
        # Pulls your secure token from GitHub Repository Secrets securely at runtime
        RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
      run: python sync_data.py

    # Step 5: Automatically commit and push updated CSV assets to your repo branch
    - name: Commit and Push Updated Data
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/*.csv
        
        # Only commit changes if the file arrays actually changed to avoid empty commit builds
        if git diff --staged --quiet; then
          echo "No historical shifts detected in data tracking assets this week. Skipping push workflow."
        else
          git commit -m "Automated Weekly Sync: Updated El Paso Housing Trackers"
          git push
        fi

    # Step 6: Package and upload the root folder containing index.html and the data/ folder
    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.' # Specifies the root directory containing your site assets

    # Step 7: Push the uploaded package live to GitHub Pages
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
